<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-FIRE MTG Deckbuilder</title>
  <style>
    :root {
      --bg-main: #121212;
      --bg-panel: #1e1e1e;
      --bg-input: #2a2a2a;
      --border-color: #3d3d3d;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --accent: #3a7bd5;
      --accent-hover: #4a8be5;
      --commander-accent: #d48806;
      --commander-accent-hover: #e09612;
      --seafoam-btn: #2eaf8a;
      --seafoam-btn-hover: #38c59c;
      --cyan-btn: #00bcd4;
      --cyan-btn-hover: #26c6da;
      --purple-btn: #8e44ad;
      --purple-btn-hover: #9b59b6;
      --red-btn: #c62828;
      --red-btn-hover: #d32f2f;
      --notice-green: #2ecc71;
      --neon-green: #39ff14;
      --preview-width: 240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .search-mode-badge {
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-size: 11px;
    }

    .header-top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-decklists-toggle {
      background-color: #2e7d32;
      border: 2px solid var(--accent);
      color: #ffffff;
      padding: 9px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: background-color 0.15s ease, filter 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .btn-decklists-toggle:hover {
      background-color: #388e3c;
      border-color: var(--accent-hover);
      filter: brightness(1.1);
    }

    .btn-to-deckbuilder-top {
      background-color: #d48806;
      border: 2px solid #f1c40f;
      color: #121212;
      padding: 9px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: background-color 0.15s ease, filter 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .btn-to-deckbuilder-top:hover {
      background-color: #e09612;
      filter: brightness(1.1);
    }

    .btn-decklists-aside {
      display: none;
    }

    #cmdr-pool-toggle-group {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border: 2px solid var(--notice-green);
      background-color: rgba(46, 204, 113, 0.08);
      border-radius: 8px;
      padding: 3px 8px;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.25);
    }

    .cmdr-toggle-pill-group {
      display: inline-flex;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .cmdr-pool-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .cmdr-pool-btn.active {
      background-color: var(--commander-accent);
      color: #121212;
    }

    .cmdr-pool-btn:hover:not(.active) {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .search-inputs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 130px;
    }

    .input-group label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input[type="text"] {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .color-toggles {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .color-toggle {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      font-size: 12px;
    }

    .color-toggle.active {
      border-color: #ffffff;
      color: #ffffff;
    }

    .color-toggle[data-color="W"].active { background-color: #9e9779; color: #111; }
    .color-toggle[data-color="U"].active { background-color: #0e68ab; }
    .color-toggle[data-color="B"].active { background-color: #4a4242; }
    .color-toggle[data-color="R"].active { background-color: #d32f2f; }
    .color-toggle[data-color="G"].active { background-color: #2e7d32; }
    .color-toggle[data-color="C"].active { background-color: #616161; }

    .all-colors-label, .exclude-lands-label, .no-game-changers-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .all-colors-label {
      margin-left: 4px;
    }

    .all-colors-label input[type="checkbox"],
    .exclude-lands-label input[type="checkbox"],
    .no-game-changers-label input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sort-left-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sort-control label:not(.exclude-lands-label):not(.no-game-changers-label) {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .sort-select {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .sort-select:focus {
      border-color: var(--accent);
    }

    .suggestion-buttons-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-edhrec-toggle {
      background-color: var(--cyan-btn);
      color: #121212;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
      transition: background-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .btn-edhrec-toggle:hover {
      background-color: var(--cyan-btn-hover);
    }

    .btn-edhrec-toggle.open {
      background-color: var(--red-btn);
      color: #ffffff;
    }

    .btn-edhrec-toggle.open:hover {
      background-color: var(--red-btn-hover);
    }

    .btn-staples-toggle {
      background-color: var(--purple-btn);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
      transition: background-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .btn-staples-toggle:hover {
      background-color: var(--purple-btn-hover);
    }

    .btn-staples-toggle.open {
      background-color: var(--red-btn);
      color: #ffffff;
    }

    .btn-staples-toggle.open:hover {
      background-color: var(--red-btn-hover);
    }

    .search-btn-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-random-cmdr {
      background-color: var(--seafoam-btn);
      color: #121212;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: background-color 0.15s ease;
      white-space: nowrap;
    }

    .btn-random-cmdr:hover {
      background-color: var(--seafoam-btn-hover);
    }

    .btn-search {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background-color 0.15s ease;
    }

    .btn-search:hover {
      background-color: var(--accent-hover);
    }

    .btn-search.commander-mode {
      background-color: var(--commander-accent);
    }

    .btn-search.commander-mode:hover {
      background-color: var(--commander-accent-hover);
    }

    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .search-progress-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: 440px;
      margin: 20px auto;
      padding: 10px 16px;
      background-color: #171717;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .search-progress-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .search-progress-track {
      width: 100%;
      height: 10px;
      background-color: #262626;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #333333;
    }

    .search-progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green), 0 0 4px #ffffff;
      border-radius: 5px;
      transition: width 0.15s ease;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      width: 100%;
    }

    .edhrec-actions-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-edhrec-add-all {
      background-color: #2e7d32;
      color: #ffffff;
      border: 1px solid #388e3c;
      padding: 7px 18px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: background-color 0.15s ease, filter 0.15s ease;
    }

    .btn-edhrec-add-all:hover {
      background-color: #388e3c;
      filter: brightness(1.1);
    }

    .category-section {
      width: 100%;
      margin-bottom: 24px;
    }

    .category-header {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--cyan-btn);
      border-bottom: 2px solid #2a2a2a;
      padding-bottom: 6px;
      margin-bottom: 12px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .category-header span.cat-count {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .load-more-wrap {
      display: none;
      justify-content: center;
      padding: 24px 0 16px 0;
      width: 100%;
      flex-shrink: 0;
    }

    .btn-load-more {
      background-color: var(--bg-input);
      border: 1px solid var(--accent);
      color: var(--accent-hover);
      padding: 10px 28px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-load-more:hover:not(:disabled) {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-load-more:disabled {
      border-color: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      background-color: var(--bg-panel);
    }

    .random-commander-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 300px;
      margin: 4px auto 20px auto;
      gap: 10px;
      box-sizing: border-box;
    }

    .btn-randomize-again {
      background-color: var(--seafoam-btn);
      color: #121212;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(46, 175, 138, 0.35);
      transition: background-color 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-randomize-again:hover {
      background-color: var(--seafoam-btn-hover);
      transform: translateY(-1px);
    }

    .featured-random-card {
      width: 100%;
      max-width: 280px;
      background-color: var(--bg-panel);
      border: 2px solid var(--commander-accent);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      max-height: calc(100dvh - 175px);
    }

    .featured-random-card img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 488 / 680;
      object-fit: contain;
      max-height: calc(100dvh - 245px);
      user-select: none;
      background-color: #1a1a1a;
    }

    .featured-random-card .card-actions {
      padding: 8px;
      background-color: var(--bg-panel);
      flex-shrink: 0;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
    }

    .card-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-item img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 488 / 680;
      background-color: #1a1a1a;
      user-select: none;
    }

    .card-actions {
      padding: 8px;
      display: flex;
      justify-content: center;
    }

    .btn-add {
      width: 100%;
      background-color: #2a2a2a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-add:hover:not(:disabled) {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-add.in-deck {
      background-color: #2e2617 !important;
      border-color: rgba(212, 136, 6, 0.5) !important;
      color: #cca453 !important;
      cursor: not-allowed !important;
      opacity: 0.9;
    }

    .btn-set-commander {
      width: 100%;
      background-color: #3d2b0f;
      border: 1px solid var(--commander-accent);
      color: #f1c40f;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-set-commander:hover {
      background-color: var(--commander-accent);
      color: #121212;
    }

    .empty-state {
      color: var(--text-muted);
      text-align: center;
      margin-top: 50px;
      font-size: 14px;
    }

    .recently-removed-panel {
      position: absolute;
      top: 0;
      right: 320px;
      width: 310px;
      height: 100%;
      background-color: rgba(24, 24, 24, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      box-shadow: -6px 0 20px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      z-index: 50;
    }

    .recently-removed-panel.open {
      display: flex;
    }

    .removed-header {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .removed-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-clear-link {
      background: none;
      border: none;
      color: #ff5252;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .btn-clear-link:hover {
      color: #ff1744;
    }

    .btn-close-removed-mobile {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .removed-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-readd {
      background-color: #2e7d32;
      border: none;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-readd:hover {
      filter: brightness(1.15);
    }

    aside {
      width: 320px;
      background-color: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 60;
    }

    .commander-section {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      background-color: #171717;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .commander-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .commander-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .commander-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .btn-choose-commander {
      width: 100%;
      background-color: #242424;
      border: 1px dashed var(--commander-accent);
      color: #f1c40f;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .btn-choose-commander:hover, .btn-choose-commander.active {
      background-color: rgba(212, 136, 6, 0.15);
    }

    .btn-add-partner-shortcut {
      background-color: #2a2215;
      border: 1px dashed var(--commander-accent);
      color: #f1c40f;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      text-align: center;
    }

    .btn-add-partner-shortcut:hover {
      background-color: rgba(212, 136, 6, 0.25);
    }

    .btn-change-commander {
      background: none;
      border: none;
      color: #ff5252;
      text-decoration: underline;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.15s ease;
    }

    .btn-change-commander:hover {
      color: #ff1744;
    }

    .commander-list-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .deck-header {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .deck-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-autobuild-trigger {
      background-color: #d48806;
      color: #121212;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      transition: background-color 0.15s ease, filter 0.15s ease;
      white-space: nowrap;
    }

    .btn-autobuild-trigger:hover:not(:disabled) {
      background-color: #e09612;
      filter: brightness(1.1);
    }

    .btn-autobuild-trigger:disabled {
      background-color: #333333;
      color: #777777;
      cursor: not-allowed;
    }

    #deck-count {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    .btn-clear-list-link {
      background: none;
      border: none;
      color: #e57373;
      text-decoration: underline;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 0;
      transition: color 0.15s ease;
    }

    .btn-clear-list-link:hover {
      color: #ff5252;
    }

    .deck-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .deck-removed-bar {
      padding: 8px 15px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      background-color: #1a1a1a;
      flex-shrink: 0;
    }

    .btn-recently-removed {
      background-color: #f1c40f;
      color: #121212;
      border: none;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-recently-removed:hover {
      background-color: #f39c12;
    }

    .btn-recently-removed.open {
      background-color: #c62828;
      color: #ffffff;
    }

    .btn-recently-removed.open:hover {
      background-color: #d32f2f;
    }

    .deck-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-input);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s ease;
      user-select: none;
      gap: 8px;
    }

    .deck-entry:hover {
      border-color: var(--accent);
    }

    .deck-entry.commander-entry {
      border-color: rgba(212, 136, 6, 0.4);
      background-color: #211c14;
    }

    .deck-entry.commander-entry:hover {
      border-color: var(--commander-accent);
    }

    .deck-entry-content {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 1;
      flex-grow: 1;
      min-width: 0;
    }

    .deck-entry-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 0 1 auto;
      min-width: 0;
    }

    .deck-entry-mana {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .mana-symbol {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .deck-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-qty {
      background-color: #383838;
      border: none;
      color: var(--text-main);
      width: 26px;
      height: 26px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .btn-qty:hover {
      background-color: #4a4a4a;
    }

    .deck-footer {
      padding: 12px 15px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-export {
      flex: 1;
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-export:hover {
      filter: brightness(1.1);
    }

    .btn-save-deck {
      flex: 1;
      background-color: #3a7bd5;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background-color 0.15s ease;
    }

    .btn-save-deck:hover {
      background-color: #4a8be5;
    }

    /* Card Preview Wrap and Elements */
    #card-preview-wrap {
      position: fixed;
      display: none;
      z-index: 10000;
      pointer-events: auto;
    }

    #card-preview {
      width: var(--preview-width, 240px);
      border-radius: 11px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
      border: 1px solid var(--border-color);
      background-color: #1a1a1a;
      display: block;
      transition: width 0.08s ease-out;
    }

    .btn-close-mobile-preview {
      display: none;
    }

    .mobile-tab-nav {
      display: none;
      background-color: #151515;
      border-top: 1px solid var(--border-color);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) 12px;
      flex-shrink: 0;
      z-index: 80;
      justify-content: center;
      align-items: center;
    }

    .mobile-view-toggle-btn {
      width: 100%;
      max-width: 420px;
      height: 44px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
      transition: transform 0.1s ease, filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-view-toggle-btn:active {
      transform: scale(0.985);
    }

    .mobile-view-toggle-btn.to-list {
      background-color: #f1c40f;
      color: #121212;
      border: 2px solid #2ecc71;
    }

    .mobile-view-toggle-btn.to-search {
      background-color: #f1c40f;
      color: #121212;
      border: 2px solid #2ecc71;
    }

    .decklists-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .decklists-modal.open {
      display: flex;
    }

    .decklists-dialog {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 90%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      position: relative;
    }

    .decklists-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .decklists-header h3 {
      font-size: 16px;
    }

    .btn-close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }

    .btn-close-modal:hover {
      color: #ffffff;
    }

    .decklists-body {
      padding: 12px 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .saved-deck-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      gap: 10px;
      position: relative;
    }

    .saved-deck-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .saved-deck-title {
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-main);
    }

    .saved-deck-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .saved-deck-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-saved-load {
      background-color: #2e7d32;
      border: none;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-saved-load:hover {
      filter: brightness(1.15);
    }

    .btn-saved-delete {
      background-color: #444444;
      border: none;
      color: #ff6b6b;
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-saved-delete:hover {
      background-color: var(--red-btn);
      color: #ffffff;
    }

    /* Auto-Build Modal Styles */
    .autobuild-modal-dialog {
      background-color: var(--bg-panel);
      border: 2px solid var(--commander-accent);
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .autobuild-modal-content {
      display: flex;
      padding: 20px;
      gap: 20px;
      align-items: flex-start;
    }

    .autobuild-preview-col {
      width: 180px;
      flex-shrink: 0;
    }

    .autobuild-preview-col img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      display: block;
      background-color: #1a1a1a;
    }

    .autobuild-form-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .autobuild-select-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .autobuild-select {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .autobuild-select:focus {
      border-color: var(--commander-accent);
    }

    .btn-execute-autobuild {
      background-color: #2e7d32;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: background-color 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      margin-top: 8px;
    }

    .btn-execute-autobuild:hover:not(:disabled) {
      background-color: #388e3c;
      filter: brightness(1.1);
    }

    .btn-execute-autobuild:disabled {
      background-color: #444444;
      color: #888888;
      cursor: not-allowed;
    }

    /* Fullscreen Deck Builder View */
    #autobuild-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-main);
      z-index: 1500;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #autobuild-screen.active {
      display: flex;
    }

    .autobuild-header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }

    .autobuild-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back-to-manual {
      background-color: #242424;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back-to-manual:hover {
      background-color: #333333;
      border-color: var(--accent);
    }

    .btn-saved-decks-toggle {
      background-color: #3a7bd5;
      border: 1px solid var(--accent-hover);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .btn-saved-decks-toggle:hover {
      background-color: #4a8be5;
    }

    .autobuild-sort-pill-group {
      display: inline-flex;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .autobuild-sort-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .autobuild-sort-btn.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    .autobuild-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .autobuild-cards-canvas {
      flex: 1;
      padding: 16px;
      overflow-x: auto;
      overflow-y: auto;
      background-color: #141414;
    }

    /* Shingled Column Display */
    .shingle-columns-container {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      min-width: max-content;
      height: 100%;
    }

    .shingle-column {
      width: 150px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .shingle-col-header {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--cyan-btn);
      padding: 4px 6px;
      border-bottom: 2px solid #2a2a2a;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .shingle-stack {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .shingle-card-item {
      position: relative;
      width: 145px;
      margin-bottom: -160px;
      transition: transform 0.15s ease, z-index 0.15s ease, margin 0.15s ease;
      cursor: pointer;
    }

    .shingle-card-item:last-child {
      margin-bottom: 0;
    }

    .shingle-card-item img {
      width: 100%;
      height: auto;
      border-radius: 7px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      background-color: #1a1a1a;
      display: block;
    }

    .shingle-card-item .basic-count-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(18, 18, 18, 0.92);
      border: 2px solid var(--neon-green);
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 10;
    }

    .shingle-card-item:hover {
      transform: translateY(-24px) scale(1.04);
      z-index: 500 !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.95);
    }

    /* Split Mode Container */
    .split-mode-container {
      display: flex;
      height: 100%;
      width: 100%;
      gap: 16px;
    }

    .split-main-spells {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .split-section {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .split-section-header {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--commander-accent);
      border-bottom: 2px solid #2a2a2a;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .split-lands-sidebar {
      width: 175px;
      border-left: 1px solid var(--border-color);
      padding-left: 12px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    #mobile-title-popup {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background-color: #2c2c2c;
      border: 1px solid var(--commander-accent);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      z-index: 10005;
      max-width: 88vw;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      text-align: center;
      line-height: 1.35;
      word-break: break-word;
      pointer-events: auto;
    }

    .mobile-random-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .mobile-random-overlay.open {
      display: flex;
    }

    .mobile-random-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 290px;
      gap: 10px;
      box-sizing: border-box;
    }

    .mobile-random-card-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--commander-accent);
      background-color: #1a1a1a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
      cursor: pointer;
    }

    .mobile-random-card-wrap img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 488 / 680;
      object-fit: contain;
      max-height: calc(100dvh - 220px);
      user-select: none;
    }

    @media (max-width: 768px) {
      .mobile-tab-nav {
        display: flex;
      }

      body.mobile-tab-deck header {
        display: none !important;
      }

      body.mobile-tab-search #btn-decklists-toggle,
      body.mobile-tab-search #btn-to-deckbuilder-top {
        display: none !important;
      }

      body.mobile-tab-deck .btn-decklists-aside {
        display: inline-block !important;
        background-color: #2e7d32;
        border: 2px solid var(--accent);
        color: #ffffff;
        padding: 5px 12px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        cursor: pointer;
      }

      header {
        padding: 6px 10px;
        max-height: 44vh;
        overflow-y: auto;
        gap: 6px;
      }

      .search-mode-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-top-actions {
        margin-left: auto;
      }

      .search-inputs {
        gap: 6px;
      }

      .input-group {
        min-width: calc(50% - 3px);
        flex: 1 1 calc(50% - 3px);
      }

      input[type="text"] {
        padding: 5px 8px;
        font-size: 12px;
      }

      .controls-row {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      .controls-left {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      .sort-control {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 4px;
      }

      .sort-left-group {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .sort-select {
        padding: 5px 6px;
        font-size: 11px;
      }

      .exclude-lands-label, .no-game-changers-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        line-height: 1.1;
        gap: 3px;
        text-align: center;
        margin: 0;
        flex-shrink: 0;
      }

      .exclude-lands-label input[type="checkbox"],
      .no-game-changers-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      .suggestion-buttons-wrap {
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: stretch;
        flex-shrink: 0;
        min-width: 125px;
      }

      .btn-edhrec-toggle, .btn-staples-toggle {
        padding: 4px 6px;
        font-size: 10px;
        text-align: center;
        width: 100%;
      }

      .color-toggles {
        justify-content: flex-start;
        gap: 4px;
      }

      .color-toggle {
        width: 28px;
        height: 28px;
        font-size: 11px;
      }

      .all-colors-label {
        font-size: 11px;
      }

      .search-btn-wrap {
        width: 100%;
      }

      .btn-search, .btn-random-cmdr {
        flex: 1;
        text-align: center;
        padding: 7px 10px;
        font-size: 12px;
      }

      .workspace {
        position: relative;
        flex: 1;
        overflow: hidden;
      }

      main {
        display: none;
        width: 100%;
        padding: 10px;
      }

      main.mobile-active {

  <script>
    function parseCmcFromManaCost(manaCost) {
      if (!manaCost) return 0;
      const symbols = manaCost.match(/\{([^}]+)\}/g) || [];
      let total = 0;
      symbols.forEach(s => {
        const inner = s.replace(/[{}]/g, '');
        const num = parseInt(inner, 10);
        if (!isNaN(num)) {
          total += num;
        } else if (inner === 'X' || inner === 'Y' || inner === 'Z') {
          total += 0;
        } else if (inner.includes('/')) {
          const parts = inner.split('/');
          if (parts[0] === '2') total += 2;
          else total += 1;
        } else {
          total += 1;
        }
      });
      return total;
    }

    function getCardCmc(card) {
      if (typeof card.cmc === 'number') return card.cmc;
      if (card.card_faces && typeof card.card_faces[0]?.cmc === 'number') {
        return card.card_faces[0].cmc;
      }
      let mc = card.mana_cost;
      if (!mc && card.card_faces && card.card_faces.length > 0) {
        mc = card.card_faces.map(f => f.mana_cost).filter(Boolean).join(' // ');
      }
      return parseCmcFromManaCost(mc);
    }

    function sortCardArray(cards, sortChoice) {
      if (sortChoice === 'name') {
        cards.sort((a, b) => a.name.localeCompare(b.name));
      } else {
        cards.sort((a, b) => {
          const cmcA = getCardCmc(a);
          const cmcB = getCardCmc(b);
          if (cmcA !== cmcB) {
            return cmcA - cmcB;
          }
          return a.name.localeCompare(b.name);
        });
      }
    }

    function isGameChangerCard(card) {
      const full = (card.name || '').trim().toLowerCase();
      const front = full.split('//')[0].trim();
      return gameChangerNamesSet.has(full) || gameChangerNamesSet.has(front);
    }

    function getCardPrimaryType(card) {
      const typeLine = (card.type_line || (card.card_faces ? card.card_faces.map(f => f.type_line).join(' ') : '')).toLowerCase();
      if (typeLine.includes('land')) return 'Lands';
      if (typeLine.includes('creature')) return 'Creatures';
      if (typeLine.includes('instant')) return 'Instants';
      if (typeLine.includes('sorcery')) return 'Sorceries';
      if (typeLine.includes('artifact')) return 'Artifacts';
      if (typeLine.includes('enchantment')) return 'Enchantments';
      if (typeLine.includes('planeswalker')) return 'Planeswalkers';
      if (typeLine.includes('battle')) return 'Battles';
      return 'Other';
    }

    async function executeTopCommandersSearch() {
      const resultsGrid = document.getElementById('results-grid');
      const emptyState = document.getElementById('empty-state');

      resultsGrid.innerHTML = '';
      loadMoreWrap.style.display = 'none';
      emptyState.style.display = 'none';
      showProgressBar('Loading top EDHREC commanders...');

      const excludeLands = excludeLandsCheckbox.checked;
      let queryParts = ['(is:commander or (is:front t:legendary t:vehicle))', '-name:"Balamb Garden"', 'f:commander', 'date<=rna'];
      if (excludeLands) queryParts.push('-t:land');

      const url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(queryParts.join(' '))}&unique=cards&order=edhrec&dir=asc`;

      try {
        updateProgressBar(30, 'Querying Scryfall API...');
        const response = await fetch(url);
        updateProgressBar(80, 'Processing response...');
        const data = await response.json();

        if (response.status === 404 || !data.data || data.data.length === 0) {
          hideProgressBar();
          emptyState.style.display = 'block';
          emptyState.textContent = 'No matching commanders found.';
          return;
        }

        if (!response.ok) {
          hideProgressBar();
          emptyState.style.display = 'block';
          emptyState.textContent = data.details || 'Error querying Scryfall API.';
          return;
        }

        updateProgressBar(100, 'Done!');
        const cards = data.data.slice(0, 75);
        nextSearchPageUrl = null;

        setTimeout(hideProgressBar, 200);
        renderResults(cards, false);
      } catch (err) {
        hideProgressBar();
        emptyState.style.display = 'block';
        emptyState.textContent = `Error: ${err.message}`;
      }
    }

    function getCommanderIdentityString() {
      if (commanders.length === 0) return '';
      let combinedIdentity = new Set();
      commanders.forEach(cmdr => {
        if (Array.isArray(cmdr.color_identity) && cmdr.color_identity.length > 0) {
          cmdr.color_identity.forEach(c => combinedIdentity.add(c.toUpperCase()));
        } else {
          const mc = (cmdr.mana_cost || '').toUpperCase();
          ['W','U','B','R','G'].forEach(col => {
            if (mc.includes(col)) combinedIdentity.add(col);
          });
        }
      });
      return Array.from(combinedIdentity).sort().join('').toLowerCase();
    }

    async function executeStaplesSearch() {
      const resultsGrid = document.getElementById('results-grid');
      const emptyState = document.getElementById('empty-state');
      const sortChoice = searchSortSelect.value || 'cmc';

      resultsGrid.innerHTML = '';
      resultsGrid.style.display = 'grid';
      loadMoreWrap.style.display = 'none';
      emptyState.style.display = 'none';

      const identityKey = getCommanderIdentityString();

      if (staplesRawCardsCache[identityKey] && staplesRawCardsCache[identityKey].length > 0) {
        hideProgressBar();
        let cards = filterCardListLocally(staplesRawCardsCache[identityKey]);
        sortCardArray(cards, sortChoice);

        if (cards.length === 0) {
          emptyState.style.display = 'block';
          emptyState.textContent = 'No Pre-FIRE staples match the specified filters.';
          return;
        }

        emptyState.style.display = 'none';
        renderResults(cards, false);
        return;
      }

      showProgressBar('Downloading top 700 Pre-FIRE staples (0/700)...');

      let queryParts = ['date<=rna', 'f:commander'];
      if (commanders.length > 0) {
        if (identityKey) {
          queryParts.push(`id<=${identityKey}`);
        } else {
          queryParts.push('id:c');
        }
      }

      let allCards = [];
      let currentUrl = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(queryParts.join(' '))}&unique=cards&order=edhrec&dir=asc`;
      const targetPages = 4;

      try {
        for (let page = 1; page <= targetPages; page++) {
          if (!currentUrl) break;

          const progressPercent = ((page - 1) / targetPages) * 100;
          updateProgressBar(progressPercent, `Downloading staples: page ${page} of ${targetPages} (${allCards.length}/700)...`);

          let res = await fetch(currentUrl);

          if (res.status === 429) {
            await new Promise(r => setTimeout(r, 1500));
            res = await fetch(currentUrl);
          }

          if (res.status === 404) break;
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.details || `Scryfall HTTP ${res.status}`);
          }

          const data = await res.json();
          if (data && data.data) {
            allCards = allCards.concat(data.data);
          }

          currentUrl = data.has_more ? data.next_page : null;

          if (page < targetPages && currentUrl) {
            await new Promise(r => setTimeout(r, 125));
          }
        }

        updateProgressBar(100, 'Filtering staples...');
        staplesRawCardsCache[identityKey] = allCards;

        let cards = filterCardListLocally(allCards);
        sortCardArray(cards, sortChoice);

        setTimeout(hideProgressBar, 200);

        if (cards.length === 0) {
          emptyState.style.display = 'block';
          emptyState.textContent = 'No Pre-FIRE staples match the specified filters.';
          return;
        }

        emptyState.style.display = 'none';
        renderResults(cards, false);

      } catch (err) {
        console.error('Staples fetch error:', err);
        hideProgressBar();
        emptyState.style.display = 'block';
        emptyState.textContent = `Error fetching staples: ${err.message}`;
      }
    }

    function detectPartner(card) {
      const fullText = (card.oracle_text || (card.card_faces ? card.card_faces.map(f => f.oracle_text).join('\n') : '') || '');
      const typeLine = (card.type_line || (card.card_faces ? card.card_faces.map(f => f.type_line).join(' // ') : '') || '');
      const keywords = card.keywords || [];

      const partnerWithMatch = fullText.match(/\bPartner with\s+([^\n\r(]+)/i);
      if (partnerWithMatch) {
        let partnerName = partnerWithMatch[1].trim().replace(/[\.\,\"\']+$/, '').trim();
        return {
          type: `Partner with "${partnerName}"`,
          query: `!"${partnerName}"`
        };
      }

      const partnerVariantMatch = fullText.match(/\bPartner\s*[\u2014\-–]\s*([^\n\r(]+)/i);
      if (partnerVariantMatch) {
        let category = partnerVariantMatch[1].trim().replace(/[\.\,\"\']+$/, '').trim();
        if (category && !/^with\b/i.test(category)) {
          return {
            type: `Partner - ${category}`,
            query: `(o:"Partner—${category}" or o:"Partner - ${category}" or (o:"Partner" o:"${category}")) -o:"Partner with" (is:commander or (t:legendary t:creature))`
          };
        }
      }

      if (keywords.includes("Friends forever") || /\bFriends forever\b/i.test(fullText)) {
        return {
          type: "Friends forever",
          query: `o:"Friends forever" (is:commander or (t:legendary t:creature))`
        };
      }

      if (/\bChoose a Background\b/i.test(fullText)) {
        return {
          type: "Choose a Background",
          query: `t:background t:legendary t:enchantment`
        };
      }

      if (/\bBackground\b/i.test(typeLine) && /\bLegendary\b/i.test(typeLine)) {
        return {
          type: "Background",
          query: `o:"Choose a Background" is:commander`
        };
      }

      if (keywords.includes("Doctor's companion") || /\bDoctor's companion\b/i.test(fullText)) {
        return {
          type: "Doctor's companion",
          query: `t:"Time Lord" t:Doctor is:commander`
        };
      }

      if (/\bTime Lord\b/i.test(typeLine) && /\bDoctor\b/i.test(typeLine) && /\bLegendary\b/i.test(typeLine)) {
        return {
          type: "Time Lord Doctor",
          query: `(o:"Doctor's companion" or name:"Clara Oswald") (is:commander or (t:legendary t:creature))`
        };
      }

      if (keywords.includes("Partner") || /\bPartner\b/i.test(fullText)) {
        if (!/\bPartner with\b/i.test(fullText) && !/\bPartner\s*[\u2014\-–]/i.test(fullText)) {
          return {
            type: "Partner",
            query: `o:"Partner" -o:"Partner with" -o:"Friends forever" -o:"Doctor's companion" -o:"Choose a Background" -o:"Partner—" -o:"Partner -" (is:commander or (t:legendary t:creature))`
          };
        }
      }

      return null;
    }

    function createManaCostElement(manaCost) {
      const wrap = document.createElement('span');
      wrap.className = 'deck-entry-mana';
      if (!manaCost) return wrap;

      const tokens = manaCost.match(/\{[^}]+\}|\/\//g);
      if (!tokens) return wrap;

      tokens.forEach(tok => {
        if (tok === '//') {
          const sep = document.createElement('span');
          sep.textContent = '//';
          sep.style.fontSize = '9px';
          sep.style.color = 'var(--text-muted)';
          sep.style.margin = '0 1px';
          wrap.appendChild(sep);
        } else {
          const clean = tok.replace(/[{}]/g, '').replace(/\//g, '').toUpperCase();
          const img = document.createElement('img');
          img.className = 'mana-symbol';
          img.src = `https://svgs.scryfall.io/card-symbols/${clean}.svg`;
          img.alt = tok;
          img.title = tok;
          img.loading = 'lazy';
          wrap.appendChild(img);
        }
      });
      return wrap;
    }

    function formatEdhrecSlug(name) {
      const front = name.split('//')[0].trim();
      return front
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/['"’]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function getCombinedPartnerRecs(cmdrA, cmdrB) {
      const slugA = formatEdhrecSlug(cmdrA.name);
      const slugB = formatEdhrecSlug(cmdrB.name);

      const listA = edhrecCache[slugA] || [];
      const listB = edhrecCache[slugB] || [];

      const combined = [];
      const seen = new Set();
      const maxLen = Math.max(listA.length, listB.length);

      for (let i = 0; i < maxLen; i++) {
        if (i < listA.length && !seen.has(listA[i])) {
          seen.add(listA[i]);
          combined.push(listA[i]);
        }
        if (i < listB.length && !seen.has(listB[i])) {
          seen.add(listB[i]);
          combined.push(listB[i]);
        }
      }
      return combined;
    }

    function getCachedRecNames() {
      if (commanders.length === 0) return [];
      if (commanders.length === 1) {
        const slug = formatEdhrecSlug(commanders[0].name);
        return edhrecCache[slug] || [];
      }
      if (commanders.length === 2) {
        const c1 = commanders[0];
        const c2 = commanders[1];

        const t1 = (c1.type_line || '').toLowerCase();
        const t2 = (c2.type_line || '').toLowerCase();

        const slug1 = formatEdhrecSlug(c1.name);
        const slug2 = formatEdhrecSlug(c2.name);

        let comboKey;

        if (t2.includes('background') || c2.partnerInfo?.type === 'Background') {
          comboKey = `${slug1}-${slug2}`;
        } else if (t1.includes('background') || c1.partnerInfo?.type === 'Background') {
          comboKey = `${slug2}-${slug1}`;
        } else if (t1.includes('doctor') && !t2.includes('doctor')) {
          comboKey = `${slug1}-${slug2}`;
        } else if (t2.includes('doctor') && !t1.includes('doctor')) {
          comboKey = `${slug2}-${slug1}`;
        } else {
          comboKey = (slug1 < slug2) ? `${slug1}-${slug2}` : `${slug2}-${slug1}`;
        }

        if (partnersCache[comboKey] && partnersCache[comboKey].length > 0) {
          return partnersCache[comboKey];
        }
        return getCombinedPartnerRecs(c1, c2);
      }
      return [];
    }

    function filterCardListLocally(cards) {
      const filterName = document.getElementById('search-name').value.trim().toLowerCase();
      const filterSupertype = document.getElementById('search-supertype').value.trim().toLowerCase();
      const filterSubtype = document.getElementById('search-subtype').value.trim().toLowerCase();
      const filterText = document.getElementById('search-text').value.trim().toLowerCase();
      const excludeLands = excludeLandsCheckbox.checked;
      const noGameChangers = noGameChangersCheckbox.checked;

      const activeToggles = Array.from(document.querySelectorAll('.color-toggle.active')).map(btn => btn.dataset.color);
      const colored = activeToggles.filter(c => c !== 'C');
      const hasColorless = activeToggles.includes('C');
      const matchAllColors = document.getElementById('match-all-colors').checked;

      return cards.filter(card => {
        const typeLine = (card.type_line || (card.card_faces ? card.card_faces.map(f => f.type_line).join(' ') : '')).toLowerCase();

        if (excludeLands && typeLine.includes('land')) return false;
        if (noGameChangers && isGameChangerCard(card)) return false;
        if (filterName && !card.name.toLowerCase().includes(filterName)) return false;
        if (filterSupertype && !typeLine.includes(filterSupertype)) return false;
        if (filterSubtype && !typeLine.includes(filterSubtype)) return false;

        if (filterText) {
          const terms = filterText.match(/"[^"]+"|\S+/g) || [];
          const fullOracle = (card.oracle_text || (card.card_faces ? card.card_faces.map(f => f.oracle_text).join(' ') : '')).toLowerCase();
          const matchesAll = terms.every(term => {
            const clean = term.replace(/^"|"$/g, '').toLowerCase();
            return fullOracle.includes(clean);
          });
          if (!matchesAll) return false;
        }

        if (activeToggles.length > 0) {
          const cardId = card.color_identity || [];
          if (activeToggles.length === 1 && hasColorless) {
            if (cardId.length > 0) return false;
          } else if (colored.length > 0) {
            if (matchAllColors) {
              const hasAll = colored.every(c => cardId.includes(c));
              const hasNoExtra = cardId.every(c => colored.includes(c));
              if (!hasAll || !hasNoExtra) return false;
            } else {
              const subset = cardId.every(c => colored.includes(c));
              if (!subset) return false;
              if (!hasColorless && cardId.length === 0) return false;
            }
          }
        }
        return true;
      });
    }

    function createCardElement(card) {
      let faces = [];
      if (card.card_faces && card.card_faces.length > 1 && card.card_faces[0].image_uris) {
        faces = card.card_faces.map(f => f.image_uris?.normal).filter(Boolean);
      } else if (card.image_uris?.normal) {
        faces = [card.image_uris.normal];
      }
      if (faces.length === 0) return null;

      let manaCost = card.mana_cost;
      if (!manaCost && card.card_faces && card.card_faces.length > 0) {
        manaCost = card.card_faces.map(f => f.mana_cost).filter(Boolean).join(' // ');
      }
      manaCost = manaCost || '';

      const cmc = (typeof card.cmc === 'number') ? card.cmc : parseCmcFromManaCost(manaCost);
      const typeLine = card.type_line || '';

      const cardItem = document.createElement('div');
      cardItem.className = 'card-item';
      cardItem.dataset.cardName = card.name;

      const img = document.createElement('img');
      img.src = faces[0];
      img.alt = card.name;
      img.loading = 'lazy';
      img.dataset.faceIndex = "0";

      if (faces.length > 1) {
        img.style.cursor = 'pointer';
        img.title = 'Click to flip card face';
        img.onclick = () => {
          let idx = parseInt(img.dataset.faceIndex, 10);
          idx = (idx + 1) % faces.length;
          img.dataset.faceIndex = idx;
          img.src = faces[idx];
        };
      }

      const actionWrap = document.createElement('div');
      actionWrap.className = 'card-actions';

      if (isPartnerSearchMode) {
        const selectPartnerBtn = document.createElement('button');
        selectPartnerBtn.className = 'btn-set-commander';
        selectPartnerBtn.textContent = '★ Select Partner';
        selectPartnerBtn.onclick = () => selectPartner(card, faces, manaCost, cmc);
        actionWrap.appendChild(selectPartnerBtn);
      } else if (isCommanderSearchMode) {
        const selectCmdrBtn = document.createElement('button');
        selectCmdrBtn.className = 'btn-set-commander';
        selectCmdrBtn.textContent = '★ Select Commander';
        selectCmdrBtn.onclick = () => selectCommander(card, faces, manaCost, cmc);
        actionWrap.appendChild(selectCmdrBtn);
      } else {
        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add';
        addBtn.dataset.cardName = card.name;
        addBtn.dataset.cardFaces = JSON.stringify(faces);
        addBtn.dataset.cardManaCost = manaCost;
        addBtn.dataset.cardCmc = cmc;
        addBtn.dataset.cardTypeLine = typeLine;

        const isInDeck = !!deck[card.name];
        if (isInDeck) {
          addBtn.textContent = 'In Deck';
          addBtn.classList.add('in-deck');
          addBtn.disabled = true;
        } else {
          addBtn.textContent = '+ Add to Deck';
          addBtn.disabled = false;
          addBtn.onclick = () => addToDeck(card.name, faces, manaCost, cmc, typeLine);
        }
        actionWrap.appendChild(addBtn);
      }

      cardItem.appendChild(img);
      cardItem.appendChild(actionWrap);
      return cardItem;
    }

    async function executeEdhrecSearch() {
      const resultsGrid = document.getElementById('results-grid');
      const emptyState = document.getElementById('empty-state');

      resultsGrid.innerHTML = '';
      loadMoreWrap.style.display = 'none';
      emptyState.style.display = 'none';

      if (commanders.length === 0) {
        hideProgressBar();
        emptyState.style.display = 'block';
        emptyState.textContent = 'Please choose a commander first to load EDHREC recommendations.';
        return;
      }

      if (Object.keys(edhrecCache).length === 0 && Object.keys(partnersCache).length === 0) {
        showProgressBar('Loading EDHREC recommendation index...');
        await loadCaches();
      }

      const legalNames = getCachedRecNames();

      if (!legalNames || legalNames.length === 0) {
        hideProgressBar();
        emptyState.style.display = 'block';
        emptyState.textContent = `No Pre-FIRE recommendations found in the cache for ${commanders.map(c => c.name).join(' & ')}.`;
        return;
      }

      const cacheKey = commanders.map(c => c.name).sort().join('___');

      if (edhrecRawCardsCache[cacheKey] && edhrecRawCardsCache[cacheKey].length > 0) {
        hideProgressBar();
        const filteredCards = filterCardListLocally(edhrecRawCardsCache[cacheKey]);
        if (filteredCards.length === 0) {
          emptyState.style.display = 'block';
          emptyState.textContent = 'No EDHREC Pre-FIRE recommendations match the specified search filters.';
          return;
        }
        emptyState.style.display = 'none';
        renderEdhrecCategorized(filteredCards);
        return;
      }

      showProgressBar(`Loading EDHREC cards (0/${legalNames.length})...`);

      try {
        const chunks = [];
        for (let i = 0; i < legalNames.length; i += 75) {
          chunks.push(legalNames.slice(i, i + 75));
        }

        let rawCards = [];
        for (let idx = 0; idx < chunks.length; idx++) {
          const chunk = chunks[idx];
          const pct = Math.round((rawCards.length / legalNames.length) * 100);
          updateProgressBar(pct, `Loading EDHREC cards (${rawCards.length}/${legalNames.length})...`);

          let res = await fetch('https://api.scryfall.com/cards/collection', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              identifiers: chunk.map(n => ({ name: n }))
            })
          });

          if (res.status === 429) {
            await new Promise(r => setTimeout(r, 1600));
            res = await fetch('https://api.scryfall.com/cards/collection', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({
                identifiers: chunk.map(n => ({ name: n }))
              })
            });
          }

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.details || `Scryfall responded with HTTP ${res.status}`);
          }

          const data = await res.json();
          if (data && data.data) {
            rawCards = rawCards.concat(data.data);
          }

          if (idx < chunks.length - 1) {
            await new Promise(r => setTimeout(r, 550));
          }
        }

        updateProgressBar(100, 'Processing cards...');
        edhrecRawCardsCache[cacheKey] = rawCards;

        const filteredCards = filterCardListLocally(rawCards);

        setTimeout(hideProgressBar, 200);

        if (filteredCards.length === 0) {
          emptyState.style.display = 'block';
          emptyState.textContent = 'No EDHREC Pre-FIRE recommendations match the specified search filters.';
          return;
        }

        emptyState.style.display = 'none';
        renderEdhrecCategorized(filteredCards);
      } catch (err) {
        console.error('EDHREC load error:', err);
        hideProgressBar();
        emptyState.style.display = 'block';
        emptyState.textContent = `Error loading recommendations: ${err.message}`;
      }
    }

    async function executeSearch() {
      const sortChoice = searchSortSelect.value || 'cmc';

      const name = document.getElementById('search-name').value.trim();
      const supertype = document.getElementById('search-supertype').value.trim();
      const subtype = document.getElementById('search-subtype').value.trim();
      const text = document.getElementById('search-text').value.trim();
      const excludeLands = excludeLandsCheckbox.checked;
      const noGameChangers = noGameChangersCheckbox.checked;

      const activeToggles = Array.from(document.querySelectorAll('.color-toggle.active')).map(btn => btn.dataset.color);
      const colored = activeToggles.filter(c => c !== 'C');
      const hasColorless = activeToggles.includes('C');
      const matchAllColors = document.getElementById('match-all-colors').checked;

      let queryParts = [];

      if (isPartnerSearchMode) {
        queryParts.push(activePartnerQuery, 'f:commander');
        if (commanderPoolMode === 'prefire' && !activePartnerQuery.startsWith('!')) {
          queryParts.push('date<=rna');
        }
      } else if (isCommanderSearchMode) {
        queryParts.push('(is:commander or (is:front t:legendary t:vehicle))', '-name:"Balamb Garden"', 'f:commander');
        if (commanderPoolMode === 'prefire') {
          queryParts.push('date<=rna');
        }
      } else {
        queryParts.push('date<=rna', 'f:commander');
      }

      if (excludeLands) {
        queryParts.push('-t:land');
      }

      if (!isCommanderSearchMode && !isPartnerSearchMode && commanders.length > 0 && activeToggles.length === 0) {
        const idKey = getCommanderIdentityString();
        if (idKey) {
          queryParts.push(`id<=${idKey}`);
        } else {
          queryParts.push('id:c');
        }
      }

      if (name) queryParts.push(`name:"${name}"`);
      if (supertype) queryParts.push(`t:"${supertype}"`);
      if (subtype) queryParts.push(`t:"${subtype}"`);

      if (text) {
        const terms = text.match(/"[^"]+"|\S+/g) || [];
        terms.forEach(term => {
          const cleanTerm = term.replace(/^"|"$/g, '').trim();
          if (cleanTerm) {
            queryParts.push(`o:"${cleanTerm}"`);
          }
        });
      }

      if (activeToggles.length > 0) {
        if (activeToggles.length === 1 && hasColorless) {
          queryParts.push('id:c');
        } else if (colored.length > 0) {
          const colStr = colored.join('').toLowerCase();
          if (matchAllColors) {
            queryParts.push(`id>=${colStr} id<=${colStr}`);
          } else {
            if (!hasColorless) {
              queryParts.push(`id<=${colStr} -id:c`);
            } else {
              queryParts.push(`id<=${colStr}`);
            }
          }
        }
      }

      const resultsGrid = document.getElementById('results-grid');
      const emptyState = document.getElementById('empty-state');

      resultsGrid.innerHTML = '';
      resultsGrid.style.display = 'grid';
      loadMoreWrap.style.display = 'none';
      emptyState.style.display = 'none';

      showProgressBar('Searching Scryfall...');

      const sortParam = isShowingStaples ? 'edhrec' : sortChoice;
      const url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(queryParts.join(' '))}&unique=cards&order=${sortParam}&dir=asc`;

      try {
        updateProgressBar(40, 'Fetching cards...');
        const response = await fetch(url);
        updateProgressBar(80, 'Processing response...');
        const data = await response.json();

        if (response.status === 404 || !data.data || data.data.length === 0) {
          hideProgressBar();
          emptyState.style.display = 'block';
          emptyState.textContent = isPartnerSearchMode
            ? 'No matching partner pairings found.'
            : (isCommanderSearchMode ? 'No matching commanders found.' : 'No matching pre-FIRE cards found.');
          return;
        }

        if (!response.ok) {
          hideProgressBar();
          emptyState.style.display = 'block';
          emptyState.textContent = data.details || `Error: ${response.statusText}`;
          return;
        }

        let cards = data.data;

        if (noGameChangers && !isCommanderSearchMode) {
          cards = cards.filter(card => !isGameChangerCard(card));
        }

        if (!isShowingStaples) {
          sortCardArray(cards, sortChoice);
        }

        nextSearchPageUrl = data.has_more ? data.next_page : null;

        updateProgressBar(100, 'Done!');
        setTimeout(hideProgressBar, 200);

        if (cards.length === 0) {
          emptyState.style.display = 'block';
          emptyState.textContent = 'No cards matched the specified filters.';
          return;
        }

        emptyState.style.display = 'none';
        renderResults(cards, false);

        if (nextSearchPageUrl) {
          loadMoreWrap.style.display = 'flex';
          btnLoadMore.disabled = false;
          btnLoadMore.textContent = 'Load More';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        hideProgressBar();
        emptyState.style.display = 'block';
        emptyState.textContent = `Error: ${err.message}. If using a privacy browser or VPN, check that api.scryfall.com is allowed.`;
      }
    }

          mobileRandomImg.src = faces[idx];
        };

    function syncSearchDeckState() {
      document.querySelectorAll('.btn-add').forEach(addBtn => {
        const cardName = addBtn.dataset.cardName;
        if (!cardName) return;

        if (deck[cardName]) {
          addBtn.textContent = 'In Deck';
          addBtn.classList.add('in-deck');
          addBtn.disabled = true;
          addBtn.onclick = null;
        } else {
          addBtn.textContent = '+ Add to Deck';
          addBtn.classList.remove('in-deck');
          addBtn.disabled = false;

          let faces = [];
          try {
            faces = JSON.parse(addBtn.dataset.cardFaces || '[]');

          const cmc = parseFloat(addBtn.dataset.cardCmc || '0');

        mana_cost: manaCost || '',
