    function addToDeck(name, faces, manaCost, cmc, typeLine = '') {
      const cardCmc = (typeof cmc === 'number') ? cmc : parseCmcFromManaCost(manaCost);
      if (!deck[name]) {
        deck[name] = { 
          count: 1, 
          faces: faces || [], 
          mana_cost: manaCost || '', 
          cmc: cardCmc,
          type_line: typeLine || ''
        };
      } else {
        deck[name].count += 1;
      }
      saveAndRenderDeck();
      syncSearchDeckState();
      renderAutobuildCanvas();
    }

    function recordRecentlyRemoved(name, faces, manaCost, cmc, typeLine = '') {
      const cardCmc = (typeof cmc === 'number') ? cmc : parseCmcFromManaCost(manaCost);
      recentlyRemoved = [{ name, faces: faces || [], mana_cost: manaCost || '', cmc: cardCmc, type_line: typeLine || '' }, ...recentlyRemoved.filter(c => c.name !== name)].slice(0, 200);
      localStorage.setItem('prefire_removed', JSON.stringify(recentlyRemoved));
      renderRecentlyRemoved();
    }

    function restoreFromRemoved(name, faces, manaCost, cmc, typeLine = '') {
      addToDeck(name, faces, manaCost, cmc, typeLine);
      recentlyRemoved = recentlyRemoved.filter(c => c.name !== name);
      localStorage.setItem('prefire_removed', JSON.stringify(recentlyRemoved));
      renderRecentlyRemoved();
    }

    function updateQuantity(name, change) {
      if (!deck[name]) return;
      const currentFaces = deck[name].faces;
      const currentMana = deck[name].mana_cost || '';
      const currentCmc = deck[name].cmc;
      const currentType = deck[name].type_line || '';
      deck[name].count += change;
      if (deck[name].count <= 0) {
        recordRecentlyRemoved(name, currentFaces, currentMana, currentCmc, currentType);
        delete deck[name];
        hidePreview();
      }
      saveAndRenderDeck();
      syncSearchDeckState();
      renderAutobuildCanvas();
    }

    function positionPreview(targetElement) {
      if (window.innerWidth <= 768) {
        previewWrapEl.style.transform = 'translateX(-50%)';
        previewWrapEl.style.left = '50%';
        previewWrapEl.style.top = '28px';
        return;
      }

      previewWrapEl.style.transform = 'none';
      const rowRect = targetElement.getBoundingClientRect();
      const previewWidth = activePreviewWidth;
      const previewHeight = previewWidth * 1.393;

      let leftPos = rowRect.left - previewWidth - 12;
      if (leftPos < 10) {
        leftPos = rowRect.right + 12;
      }

      let topPos = rowRect.top - 40;
      if (topPos + previewHeight > window.innerHeight - 10) {
        topPos = window.innerHeight - previewHeight - 10;
      }
      if (topPos < 10) topPos = 10;

      previewWrapEl.style.left = `${leftPos}px`;
      previewWrapEl.style.top = `${topPos}px`;
    }

    function getDirectScryfallImageUrl(name) {
      const frontName = name.split('//')[0].trim();
      return `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(frontName)}&format=image&version=normal`;
    }

    async function ensureCardData(name, cardRef) {
      const needsFaces = !cardRef || !cardRef.faces || cardRef.faces.length <= 1;
      const needsMana = !cardRef || !cardRef.mana_cost;
      const needsCmc = !cardRef || typeof cardRef.cmc !== 'number';
      const needsPartner = !cardRef || !cardRef.partnerInfo;
      const needsId = !cardRef || !cardRef.color_identity;
      const needsType = !cardRef || !cardRef.type_line;

      if (!needsFaces && !needsMana && !needsCmc && !needsPartner && !needsId && !needsType) return cardRef.faces;

      try {
        const res = await fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name)}`);
        if (res.ok) {
          const data = await res.json();
          let updated = false;

          let mc = data.mana_cost;
          if (!mc && data.card_faces && data.card_faces.length > 0) {
            mc = data.card_faces.map(f => f.mana_cost).filter(Boolean).join(' // ');
          }
          if (mc && cardRef && !cardRef.mana_cost) {
            cardRef.mana_cost = mc;
            updated = true;
          }

          if (data.color_identity && cardRef && !cardRef.color_identity) {
            cardRef.color_identity = data.color_identity;
            updated = true;
          }

          if (data.type_line && cardRef && !cardRef.type_line) {
            cardRef.type_line = data.type_line;
            updated = true;
          }

          if (typeof data.cmc === 'number' && cardRef && cardRef.cmc !== data.cmc) {
            cardRef.cmc = data.cmc;
            updated = true;
          }

          if (!cardRef.partnerInfo) {
            const pInfo = detectPartner(data);
            if (pInfo) {
              cardRef.partnerInfo = pInfo;
              updated = true;
            }
          }

          if (data.card_faces && data.card_faces.length > 1 && data.card_faces[0].image_uris) {
            const fetchedFaces = data.card_faces.map(f => f.image_uris?.normal).filter(Boolean);
            if (fetchedFaces.length > 1 && cardRef) {
              cardRef.faces = fetchedFaces;
              updated = true;
            }
          }

          if (updated) {
            if (commanders.some(c => c.name === name)) {
              localStorage.setItem('prefire_commanders', JSON.stringify(commanders));
              renderCommander();
            }
            if (deck[name]) {
              saveAndRenderDeck();
            }
            if (recentlyRemoved.some(c => c.name === name)) {
              localStorage.setItem('prefire_removed', JSON.stringify(recentlyRemoved));
            }
          }

          if (cardRef && cardRef.faces && cardRef.faces.length > 1) {
            return cardRef.faces;
          }
        }
      } catch (err) {}

      return (cardRef && cardRef.faces && cardRef.faces.length > 0)
        ? cardRef.faces
        : [getDirectScryfallImageUrl(name)];
    }

    function showPreview(targetEl, name, faces) {
      const cmdrMatch = commanders.find(c => c.name === name);
      let cardFaces = (faces && faces.length > 0)
        ? faces
        : (deck[name]?.faces?.length > 0 ? deck[name].faces : (cmdrMatch?.faces?.length > 0 ? cmdrMatch.faces : []));

      const resolvedFaces = (cardFaces && cardFaces.length > 0)
        ? cardFaces
        : [getDirectScryfallImageUrl(name)];

      currentPreview = {
        name: name,
        faces: resolvedFaces,
        faceIndex: 0,
        lastTargetEl: targetEl
      };

      previewEl.src = resolvedFaces[0];
      previewEl.style.width = `${activePreviewWidth}px`;
      positionPreview(targetEl);
      previewWrapEl.style.display = 'block';

      if (resolvedFaces.length <= 1) {
        const ref = cmdrMatch || (deck[name] || recentlyRemoved.find(c => c.name === name));
        ensureCardData(name, ref).then(updated => {
          if (currentPreview.name === name && updated && updated.length > 1) {
            currentPreview.faces = updated;
            previewEl.src = updated[currentPreview.faceIndex || 0];
          }
        });
      }
    }

    async function flipCard(name, targetEl) {
      const cmdrMatch = commanders.find(c => c.name === name);
      let cardRef = cmdrMatch || (deck[name] || recentlyRemoved.find(c => c.name === name));
      let cardFaces = (cardRef && cardRef.faces && cardRef.faces.length > 0) ? cardRef.faces : currentPreview.faces;

      if (!cardFaces || cardFaces.length <= 1) {
        cardFaces = await ensureCardData(name, cardRef);
      }

      if (currentPreview.name !== name || previewWrapEl.style.display === 'none') {
        currentPreview = {
          name: name,
          faces: cardFaces,
          faceIndex: 0,
          lastTargetEl: targetEl
        };
      } else {
        currentPreview.faces = cardFaces;
      }

      if (currentPreview.faces.length > 1) {
        currentPreview.faceIndex = (currentPreview.faceIndex + 1) % currentPreview.faces.length;
        previewEl.src = currentPreview.faces[currentPreview.faceIndex];
      }

      positionPreview(targetEl);
      previewWrapEl.style.display = 'block';
    }

    function hidePreview() {
      previewWrapEl.style.display = 'none';
      previewEl.src = '';
      currentPreview = { name: '', faces: [], faceIndex: 0, lastTargetEl: null };
    }

    function renderRecentlyRemoved() {
      const removedListEl = document.getElementById('removed-list');
      const removedCountEl = document.getElementById('removed-count');

      removedListEl.innerHTML = '';
      removedCountEl.textContent = `${recentlyRemoved.length}/200`;

      if (recentlyRemoved.length === 0) {
        removedListEl.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 30px;">No removed cards</div>';
        return;
      }

      recentlyRemoved.forEach(item => {
        const row = document.createElement('div');
        row.className = 'deck-entry';
        row.dataset.cardName = item.name;

        row.addEventListener('mouseenter', () => {
          if (window.innerWidth > 768) showPreview(row, item.name, item.faces);
        });
        row.addEventListener('mouseleave', () => {
          if (window.innerWidth > 768) hidePreview();
        });

        row.addEventListener('click', (e) => {
          if (e.target.closest('.btn-readd')) return;
          e.stopPropagation();
          handleCardEntryClick(item.name, row, item.faces);
        });

        const contentWrap = document.createElement('div');
        contentWrap.className = 'deck-entry-content';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'deck-entry-name';
        nameSpan.textContent = item.name;
        nameSpan.title = item.name;

        const manaSpan = createManaCostElement(item.mana_cost);

        contentWrap.appendChild(nameSpan);
        contentWrap.appendChild(manaSpan);

        const readdBtn = document.createElement('button');
        readdBtn.className = 'btn-readd';
        readdBtn.textContent = '+ Re-add';
        readdBtn.onclick = (e) => {
          e.stopPropagation();
          restoreFromRemoved(item.name, item.faces, item.mana_cost, item.cmc, item.type_line);
        };

        row.appendChild(contentWrap);
        row.appendChild(readdBtn);
        removedListEl.appendChild(row);
      });
    }

    function getSortedCardNames() {
      return Object.keys(deck).sort((a, b) => {
        const itemA = deck[a];
        const itemB = deck[b];
        const cmcA = (itemA && typeof itemA.cmc === 'number') ? itemA.cmc : parseCmcFromManaCost(itemA?.mana_cost);
        const cmcB = (itemB && typeof itemB.cmc === 'number') ? itemB.cmc : parseCmcFromManaCost(itemB?.mana_cost);

        if (cmcA !== cmcB) {
          return cmcA - cmcB;
        }
        return a.localeCompare(b);
      });
    }

    function renderDeckListToContainer(containerEl) {
      containerEl.innerHTML = '';
      const cardNames = getSortedCardNames();

      if (cardNames.length === 0) {
        containerEl.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 30px;">Deck is empty</div>';
        return 0;
      }

      let totalCards = 0;
      cardNames.forEach(name => {
        const item = deck[name];
        totalCards += item.count;

        const row = document.createElement('div');
        row.className = 'deck-entry';
        row.dataset.cardName = name;

        row.addEventListener('mouseenter', () => {
          if (window.innerWidth > 768) showPreview(row, name, item.faces);
        });
        row.addEventListener('mouseleave', () => {
          if (window.innerWidth > 768) hidePreview();
        });

        row.addEventListener('click', (e) => {
          if (e.target.closest('.deck-controls')) return;
          e.stopPropagation();
          handleCardEntryClick(name, row, item.faces);
        });

        const contentWrap = document.createElement('div');
        contentWrap.className = 'deck-entry-content';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'deck-entry-name';
        nameSpan.textContent = `${item.count}x ${name}`;
        nameSpan.title = `${item.count}x ${name}`;

        const manaSpan = createManaCostElement(item.mana_cost);

        contentWrap.appendChild(nameSpan);
        contentWrap.appendChild(manaSpan);

        const controls = document.createElement('div');
        controls.className = 'deck-controls';

        const decBtn = document.createElement('button');
        decBtn.className = 'btn-qty';
        decBtn.textContent = '-';
        decBtn.onclick = (e) => {
          e.stopPropagation();
          updateQuantity(name, -1);
        };

        const incBtn = document.createElement('button');
        incBtn.className = 'btn-qty';
        incBtn.textContent = '+';
        incBtn.onclick = (e) => {
          e.stopPropagation();
          updateQuantity(name, 1);
        };

        controls.appendChild(decBtn);
        controls.appendChild(incBtn);

        row.appendChild(contentWrap);
        row.appendChild(controls);
        containerEl.appendChild(row);
      });

      return totalCards;
    }

    function saveAndRenderDeck() {
      localStorage.setItem('prefire_deck', JSON.stringify(deck));
      const deckListEl = document.getElementById('deck-list');
      const countEl = document.getElementById('deck-count');
      const deckListAuto = document.getElementById('deck-list-autobuild');
      const countElAuto = document.getElementById('deck-count-autobuild');
      const autobuildCountBadge = document.getElementById('autobuild-count-badge');

      const totalCards = renderDeckListToContainer(deckListEl);
      if (deckListAuto) renderDeckListToContainer(deckListAuto);

      const cmdrLabel = commanders.length > 0 ? ` (+${commanders.length} Commander${commanders.length === 1 ? '' : 's'})` : '';
      countEl.textContent = `${totalCards} Cards${cmdrLabel}`;
      if (countElAuto) countElAuto.textContent = `${totalCards} Cards${cmdrLabel}`;
      if (autobuildCountBadge) autobuildCountBadge.textContent = `${totalCards + commanders.length} Cards`;
      
      updateMobileViewToggleButton();
    }

    document.getElementById('btn-export').addEventListener('click', () => {
      exportDeckToClipboard(document.getElementById('btn-export'));
    });

    document.getElementById('btn-export-autobuild').addEventListener('click', () => {
      exportDeckToClipboard(document.getElementById('btn-export-autobuild'));
    });

    function exportDeckToClipboard(btnElement) {
      const cardNames = getSortedCardNames();
      if (commanders.length === 0 && cardNames.length === 0) return;

      let exportLines = [];
      if (commanders.length > 0) {
        exportLines.push(`// Commander${commanders.length > 1 ? 's' : ''}`);
        commanders.forEach(cmdr => {
          exportLines.push(`1 ${cmdr.name}`);
        });
        exportLines.push('');
        exportLines.push('// Deck');
      }

      cardNames.forEach(name => {
        exportLines.push(`${deck[name].count} ${name}`);
      });

      const exportText = exportLines.join('\n');
      navigator.clipboard.writeText(exportText).then(() => {
        const originalText = btnElement.textContent;
        btnElement.textContent = 'Copied to Clipboard!';
        setTimeout(() => {
          btnElement.textContent = originalText;
        }, 1500);
      });
    }

    /* -------------------------------------------------------------------------
       DECK BUILDER (SHINGLED CANVAS) & AUTO-BUILD ENGINE
    -------------------------------------------------------------------------- */
    let generatorInstance = null;
    let activeAutobuildView = 'cmc';
    let loadedCommanderThemesData = null;

    const autobuildModal = document.getElementById('autobuild-modal');
    const btnCloseAutobuildModal = document.getElementById('btn-close-autobuild-modal');
    const autobuildThemeSelect = document.getElementById('autobuild-theme-select');
    const autobuildCmdrImg = document.getElementById('autobuild-cmdr-img');
    const btnExecuteAutobuild = document.getElementById('btn-execute-autobuild');
    const autobuildStatusText = document.getElementById('autobuild-status-text');
    const autobuildScreen = document.getElementById('autobuild-screen');
    const btnBackToManual = document.getElementById('btn-back-to-manual');

    function getDeckGenerator() {
      if (!generatorInstance && window.PrefireDeckGenerator) {
        generatorInstance = new window.PrefireDeckGenerator();
      }
      return generatorInstance;
    }

    // Header buttons switching between Card Search and Deck Builder
    btnToDeckbuilderTop.addEventListener('click', () => {
      document.getElementById('autobuild-deck-title').textContent = `${getActiveDeckTitle()} — Deck Builder`;
      autobuildScreen.classList.add('active');
      renderAutobuildCanvas();
    });

    btnBackToManual.addEventListener('click', () => {
      autobuildScreen.classList.remove('active');
    });

    document.getElementById('btn-autobuild-trigger').addEventListener('click', async () => {
      if (commanders.length === 0) return;
      const gen = getDeckGenerator();
      if (!gen) {
        alert("Generator script not loaded yet.");
        return;
      }

      const primary = commanders[0];
      const secondary = commanders[1] || null;
      const slug = gen.getCommanderSlug(primary.name, secondary ? secondary.name : null);

      autobuildCmdrImg.src = (primary.faces && primary.faces[0]) || getDirectScryfallImageUrl(primary.name);
      autobuildThemeSelect.innerHTML = '<option value="">Loading available themes...</option>';
      autobuildStatusText.textContent = '';
      btnExecuteAutobuild.disabled = true;

      autobuildModal.classList.add('open');

      try {
        loadedCommanderThemesData = await gen.loadCommanderThemes(slug);
        autobuildThemeSelect.innerHTML = '';

        const defaultOption = document.createElement('option');
        defaultOption.value = 'default';
        defaultOption.textContent = 'Default / High Synergy';
        autobuildThemeSelect.appendChild(defaultOption);

        if (loadedCommanderThemesData.themes) {
          Object.keys(loadedCommanderThemesData.themes).forEach(tSlug => {
            const tObj = loadedCommanderThemesData.themes[tSlug];
            const opt = document.createElement('option');
            opt.value = tSlug;
            opt.textContent = tObj.label || tSlug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            autobuildThemeSelect.appendChild(opt);
          });
        }

        btnExecuteAutobuild.disabled = false;
      } catch (err) {
        console.error("Theme fetch failed:", err);
        autobuildThemeSelect.innerHTML = '<option value="default">Default / High Synergy</option>';
        autobuildStatusText.textContent = 'Using baseline synergy data.';
        btnExecuteAutobuild.disabled = false;
      }
    });

    btnCloseAutobuildModal.addEventListener('click', () => {
      autobuildModal.classList.remove('open');
    });

    btnExecuteAutobuild.addEventListener('click', async () => {
      const gen = getDeckGenerator();
      if (!gen) return;

      btnExecuteAutobuild.disabled = true;
      autobuildStatusText.textContent = 'Assembling 99-card Pre-FIRE shell...';

      const selectedTheme = autobuildThemeSelect.value;
      const primary = commanders[0];
      const secondary = commanders[1] || null;

      try {
        const catalog = {};
        commanders.forEach(c => {
          catalog[c.name] = { color_identity: c.color_identity, mana_cost: c.mana_cost, cmc: c.cmc, type_line: c.type_line };
        });
        Object.keys(deck).forEach(name => {
          catalog[name] = { mana_cost: deck[name].mana_cost, cmc: deck[name].cmc, type_line: deck[name].type_line };
        });

        const generatedCards = await gen.generate(primary.name, secondary ? secondary.name : null, selectedTheme, catalog);
        
        deck = {};
        for (const cName of generatedCards) {
          if (!deck[cName]) {
            deck[cName] = { count: 1, faces: [getDirectScryfallImageUrl(cName)], mana_cost: '', cmc: 0, type_line: '' };
          } else {
            deck[cName].count += 1;
          }
        }

        saveAndRenderDeck();
        syncSearchDeckState();

        autobuildModal.classList.remove('open');
        document.getElementById('autobuild-deck-title').textContent = `${getActiveDeckTitle()} — ${selectedTheme.toUpperCase()}`;
        autobuildScreen.classList.add('active');

        resolveMissingCardData().then(() => {
          renderAutobuildCanvas();
        });

        renderAutobuildCanvas();

      } catch (err) {
        console.error("Auto-build assembly failed:", err);
        autobuildStatusText.textContent = `Error building deck: ${err.message}`;
      } finally {
        btnExecuteAutobuild.disabled = false;
      }
    });

    async function resolveMissingCardData() {
      const names = Object.keys(deck).filter(name => !deck[name].type_line || typeof deck[name].cmc !== 'number');
      if (names.length === 0) return;

      const chunks = [];
      for (let i = 0; i < names.length; i += 75) {
        chunks.push(names.slice(i, i + 75));
      }

      for (const chunk of chunks) {
        try {
          const res = await fetch('https://api.scryfall.com/cards/collection', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ identifiers: chunk.map(n => ({ name: n })) })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.data)) {
              data.data.forEach(card => {
                if (card && card.name && deck[card.name]) {
                  deck[card.name].cmc = getCardCmc(card);
                  deck[card.name].type_line = card.type_line || '';
                  deck[card.name].mana_cost = card.mana_cost || '';
                  let faces = [];
                  if (card.card_faces && card.card_faces.length > 1 && card.card_faces[0].image_uris) {
                    faces = card.card_faces.map(f => f.image_uris?.normal).filter(Boolean);
                  } else if (card.image_uris?.normal) {
                    faces = [card.image_uris.normal];
                  }
                  if (faces.length > 0) {
                    deck[card.name].faces = faces;
                  }
                }
              });
            }
          }
        } catch (e) {}
      }
      saveAndRenderDeck();
    }
      saveAndRenderDeck();
    }

    document.querySelectorAll('.autobuild-sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.autobuild-sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeAutobuildView = btn.dataset.view;
        renderAutobuildCanvas();
      });
    });

    const BASIC_LAND_NAMES = new Set(["Plains", "Island", "Swamp", "Mountain", "Forest", "Wastes"]);

    function createShingleCardElement(cardName, zIndex, countBadge = null) {
      const item = deck[cardName] || { faces: [getDirectScryfallImageUrl(cardName)] };
      const el = document.createElement('div');
      el.className = 'shingle-card-item';
      el.style.zIndex = zIndex;

      const img = document.createElement('img');
      img.src = (item.faces && item.faces[0]) ? item.faces[0] : getDirectScryfallImageUrl(cardName);
      img.alt = cardName;
      img.loading = 'lazy';
      el.appendChild(img);

      if (countBadge && countBadge > 1) {
        const badge = document.createElement('div');
        badge.className = 'basic-count-badge';
        badge.textContent = `X${countBadge}`;
        el.appendChild(badge);
      }

      el.addEventListener('mouseenter', () => showPreview(el, cardName, item.faces));
      el.addEventListener('mouseleave', () => hidePreview());
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        handleCardEntryClick(cardName, el, item.faces);
      });

      return el;
    }

    function renderAutobuildCanvas() {
      const canvas = document.getElementById('autobuild-canvas');
      canvas.innerHTML = '';

      const cardNames = getSortedCardNames();
      if (cardNames.length === 0) {
        canvas.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 50px;">No cards in deck.</div>';
        return;
      }

      if (activeAutobuildView === 'cmc') {
        renderCanvasByCmc(canvas, cardNames);
      } else if (activeAutobuildView === 'type') {
        renderCanvasByType(canvas, cardNames);
      } else if (activeAutobuildView === 'split') {
        renderCanvasSplit(canvas, cardNames);
      }
    }

    function renderCanvasByCmc(canvas, cardNames) {
      const container = document.createElement('div');
      container.className = 'shingle-columns-container';

      const cmcBuckets = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };

      cardNames.forEach(name => {
        const item = deck[name];
        const cmc = Math.min(Math.floor(item.cmc || 0), 6);
        if (BASIC_LAND_NAMES.has(name)) {
          cmcBuckets[cmc].push({ name, count: item.count });
        } else {
          for (let i = 0; i < (item.count || 1); i++) {
            cmcBuckets[cmc].push({ name, count: 1 });
          }
        }
      });

      Object.keys(cmcBuckets).forEach(cmc => {
        const list = cmcBuckets[cmc];
        const col = document.createElement('div');
        col.className = 'shingle-column';

        const totalCardsInCol = list.reduce((sum, item) => sum + item.count, 0);
        const header = document.createElement('div');
        header.className = 'shingle-col-header';
        header.innerHTML = `<span>CMC ${cmc === '6' ? '6+' : cmc}</span> <span>${totalCardsInCol}</span>`;
        col.appendChild(header);

        const stack = document.createElement('div');
        stack.className = 'shingle-stack';

        list.forEach((entry, idx) => {
          stack.appendChild(createShingleCardElement(entry.name, idx + 1, BASIC_LAND_NAMES.has(entry.name) ? entry.count : null));
        });

        col.appendChild(stack);
        container.appendChild(col);
      });

      canvas.appendChild(container);
    }

    function renderCanvasByType(canvas, cardNames) {
      const container = document.createElement('div');
      container.className = 'shingle-columns-container';

      const typeBuckets = {
        'Creatures': [],
        'Instants': [],
        'Sorceries': [],
        'Artifacts': [],
        'Enchantments': [],
        'Planeswalkers': [],
        'Lands': []
      };

      cardNames.forEach(name => {
        const item = deck[name];
        const cat = getCardPrimaryType(item);
        const targetList = typeBuckets[cat] || typeBuckets['Artifacts'];
        if (BASIC_LAND_NAMES.has(name)) {
          targetList.push({ name, count: item.count, cmc: item.cmc || 0 });
        } else {
          for (let i = 0; i < (item.count || 1); i++) {
            targetList.push({ name, count: 1, cmc: item.cmc || 0 });
          }
        }
      });

      Object.keys(typeBuckets).forEach(typeKey => {
        const list = typeBuckets[typeKey];
        if (list.length === 0) return;

        list.sort((a, b) => a.cmc - b.cmc);

        const col = document.createElement('div');
        col.className = 'shingle-column';

        const totalColCards = list.reduce((sum, item) => sum + item.count, 0);
        const header = document.createElement('div');
        header.className = 'shingle-col-header';
        header.innerHTML = `<span>${typeKey}</span> <span>${totalColCards}</span>`;
        col.appendChild(header);

        const stack = document.createElement('div');
        stack.className = 'shingle-stack';

        list.forEach((entry, idx) => {
          stack.appendChild(createShingleCardElement(entry.name, idx + 1, BASIC_LAND_NAMES.has(entry.name) ? entry.count : null));
        });

        col.appendChild(stack);
        container.appendChild(col);
      });

      canvas.appendChild(container);
    }

    function renderCanvasSplit(canvas, cardNames) {
      const splitWrap = document.createElement('div');
      splitWrap.className = 'split-mode-container';

      const spellsMain = document.createElement('div');
      spellsMain.className = 'split-main-spells';

      const creaturesSec = document.createElement('div');
      creaturesSec.className = 'split-section';
      creaturesSec.innerHTML = '<div class="split-section-header">Creatures</div>';

      const noncreaturesSec = document.createElement('div');
      noncreaturesSec.className = 'split-section';
      noncreaturesSec.innerHTML = '<div class="split-section-header">Noncreature Spells</div>';

      const landsSidebar = document.createElement('div');
      landsSidebar.className = 'split-lands-sidebar';
      landsSidebar.innerHTML = '<div class="split-section-header">Lands</div>';

      const creatureBuckets = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
      const noncreatureBuckets = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
      const landsList = [];

      cardNames.forEach(name => {
        const item = deck[name];
        const cat = getCardPrimaryType(item);
        const cmc = Math.min(Math.floor(item.cmc || 0), 6);

        if (cat === 'Lands') {
          if (BASIC_LAND_NAMES.has(name)) {
            landsList.push({ name, count: item.count });
          } else {
            for (let i = 0; i < (item.count || 1); i++) landsList.push({ name, count: 1 });
          }
        } else if (cat === 'Creatures') {
          for (let i = 0; i < (item.count || 1); i++) creatureBuckets[cmc].push({ name, count: 1 });
        } else {
          for (let i = 0; i < (item.count || 1); i++) noncreatureBuckets[cmc].push({ name, count: 1 });
        }
      });

      const creatureRow = document.createElement('div');
      creatureRow.className = 'shingle-columns-container';
      Object.keys(creatureBuckets).forEach(cmc => {
        const list = creatureBuckets[cmc];
        const col = document.createElement('div');
        col.className = 'shingle-column';
        col.innerHTML = `<div class="shingle-col-header"><span>CMC ${cmc === '6' ? '6+' : cmc}</span><span>${list.length}</span></div>`;
        const stack = document.createElement('div');
        stack.className = 'shingle-stack';
        list.forEach((entry, idx) => stack.appendChild(createShingleCardElement(entry.name, idx + 1)));
        col.appendChild(stack);
        creatureRow.appendChild(col);
      });
      creaturesSec.appendChild(creatureRow);

      const noncreatureRow = document.createElement('div');
      noncreatureRow.className = 'shingle-columns-container';
      Object.keys(noncreatureBuckets).forEach(cmc => {
        const list = noncreatureBuckets[cmc];
        const col = document.createElement('div');
        col.className = 'shingle-column';
        col.innerHTML = `<div class="shingle-col-header"><span>CMC ${cmc === '6' ? '6+' : cmc}</span><span>${list.length}</span></div>`;
        const stack = document.createElement('div');
        stack.className = 'shingle-stack';
        list.forEach((entry, idx) => stack.appendChild(createShingleCardElement(entry.name, idx + 1)));
        col.appendChild(stack);
        noncreatureRow.appendChild(col);
      });
      noncreaturesSec.appendChild(noncreatureRow);

      spellsMain.appendChild(creaturesSec);
      spellsMain.appendChild(noncreaturesSec);

      const landStack = document.createElement('div');
      landStack.className = 'shingle-stack';
      landsList.forEach((entry, idx) => {
        landStack.appendChild(createShingleCardElement(entry.name, idx + 1, BASIC_LAND_NAMES.has(entry.name) ? entry.count : null));
      });
      landsSidebar.appendChild(landStack);

      splitWrap.appendChild(spellsMain);
      splitWrap.appendChild(landsSidebar);
      canvas.appendChild(splitWrap);
    }

    renderCommander();
    saveAndRenderDeck();
    renderRecentlyRemoved();
  </script>
</body>
</html>
